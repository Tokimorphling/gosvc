syntax = "proto3";

package greeter.v1;

option go_package = "github.com/Tokimorphling/gosvc/examples/app/api/greeter/v1;greeterv1";

// Greeter demonstrates the multi-protocol template: the same domain service is
// exposed through REST, JSON-RPC 2.0 and gRPC without duplicating business logic.
service Greeter {
  rpc SayHello(SayHelloRequest) returns (SayHelloResponse);
  rpc GetGreeting(GetGreetingRequest) returns (GetGreetingResponse);
  rpc Info(InfoRequest) returns (InfoResponse);
  // Server-streaming demo: the same domain data, streamed until the client
  // cancels. Stream RPCs go through the same interceptor chain (auth, rate
  // limit, metrics, logging) as unary ones.
  rpc WatchGreetings(WatchGreetingsRequest) returns (stream GreetingUpdate);
}

message SayHelloRequest {
  string name = 1;
}

message SayHelloResponse {
  string message = 1;
  string server = 2;
  string protocol = 3;
  string served_at = 4;
}

message GetGreetingRequest {
  int64 id = 1;
}

message GetGreetingResponse {
  int64 id = 1;
  string text = 2;
}

message InfoRequest {}

message InfoResponse {
  string name = 1;
  string version = 2;
  string started_at = 3;
  int64 uptime_seconds = 4;
  int64 requests = 5;
}

message WatchGreetingsRequest {
  int64 id = 1;
}

message GreetingUpdate {
  int64 id = 1;
  string text = 2;
  int64 sequence = 3;
}
