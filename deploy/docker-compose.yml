services:
  gosvc:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: gosvc:local
    environment:
      # Listen on the container interface; the published host port remains private.
      GOSVC_ADMIN_ADDR: "0.0.0.0:6060"
    ports:
      - "8080:8080"   # REST + JSON-RPC
      - "9090:9090"   # gRPC
      # The admin port stays loopback-only: it exposes pprof, the config dump
      # and the reload trigger, none of which belong on a public interface.
      # Access it on the host with curl 127.0.0.1:6060/metrics.
      - "127.0.0.1:6060:6060"
    healthcheck:
      test: ["CMD", "/app/gosvc", "-healthcheck", "http://127.0.0.1:6060/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 3s
    restart: unless-stopped
