name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [., examples/kitex, examples/deploydemo]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: true
          cache-dependency-path: ${{ matrix.module }}/go.sum

      - name: Format check
        if: matrix.module == '.'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test (race)
        run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Lint (vet, modernization, gopls, golangci-lint)
        run: make lint

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -f deploy/Dockerfile -t gosvc:ci .

      - name: Start and probe the container
        run: |
          set -eu
          container=$(docker run -d gosvc:ci)
          trap 'docker logs "$container"; docker rm -f "$container"' EXIT
          ready=false
          for attempt in $(seq 1 30); do
            if docker exec "$container" /app/gosvc -healthcheck http://127.0.0.1:6060/readyz; then
              ready=true
              break
            fi
            sleep 1
          done
          test "$ready" = true
          docker stop --time 15 "$container"
          test "$(docker inspect -f '{{.State.ExitCode}}' "$container")" = 0
